    <!-- Card de login -->
    <div class="card-login w-full max-w-sm rounded-3xl p-8 shadow-2xl">
        <h2 class="text-white font-black text-xl text-center mb-1 tracking-tight">Acesso ao Sistema</h2>
        <p class="text-slate-500 text-xs text-center mb-8 font-medium">Digite suas credenciais para entrar</p>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="text-slate-400 text-[11px] font-black uppercase tracking-wider block mb-2">Login da Empresa</label>
                <input type="text" id="login-empresa" placeholder="Ex: conexao"
                    class="w-full bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-600 p-3 rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-medium">
            </div>
            <div>
                <label class="text-slate-400 text-[11px] font-black uppercase tracking-wider block mb-2">Senha</label>
                <div class="relative">
                    <input type="password" id="senha-empresa" placeholder="••••••••"
                        class="w-full bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-600 p-3 rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-medium pr-10">
                    <button type="button" onclick="toggleSenha()"
                        class="absolute right-3 top-3 text-slate-500 hover:text-slate-300 transition-colors text-sm" id="btn-olho">👁️</button>
                </div>
            </div>

            <div id="erro-login" class="hidden bg-red-900/50 border border-red-700 text-red-300 text-xs font-bold p-3 rounded-xl text-center"></div>

            <button type="submit" id="btn-entrar"
                class="btn-login w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3.5 rounded-xl transition-all active:scale-95 mt-2 tracking-wide">
                ENTRAR
            </button>
        </form>

        <p class="text-slate-700 text-[10px] text-center mt-6 font-medium">
            CaioSystem © 2026 · Desenvolvimento de Sistemas e App
        </p>
    </div>

    <script>
    const _supabaseUrl = 'https://jrmztxlwvwwqllgueblw.supabase.co';
    const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpybXp0eGx3dnd3cWxsZ3VlYmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjUyNTgsImV4cCI6MjA5MjMwMTI1OH0.hgI2QdCsnvbxTdGti94KqWT-SK1-77VSW3b5JBzvKnI';
    const supabaseClient = supabase.createClient(_supabaseUrl, _supabaseKey);

    function toggleSenha() {
        var inp = document.getElementById('senha-empresa');
        var olho = document.getElementById('btn-olho');
        if (inp.type === 'password') { inp.type = 'text'; olho.innerText = '🙈'; }
        else { inp.type = 'password'; olho.innerText = '👁️'; }
    }

    document.getElementById('form-login').addEventListener('submit', async function(e) {
        e.preventDefault();
        var login = document.getElementById('login-empresa').value.trim().toLowerCase();
        var senha = document.getElementById('senha-empresa').value;
        var erroEl = document.getElementById('erro-login');
        var btn    = document.getElementById('btn-entrar');

        erroEl.classList.add('hidden');
        btn.innerText  = 'VERIFICANDO...';
        btn.disabled   = true;

        if (!login || !senha) {
            erroEl.innerText = 'Preencha o login e a senha.';
            erroEl.classList.remove('hidden');
            btn.innerText = 'ENTRAR'; btn.disabled = false;
            return;
        }

        var { data, error } = await supabaseClient
            .from('empresas')
            .select('id, nome, ativo')
            .eq('login', login)
            .eq('senha', senha)
            .single();

        if (error || !data) {
            erroEl.innerText = 'Login ou senha incorretos. Tente novamente.';
            erroEl.classList.remove('hidden');
            btn.innerText = 'ENTRAR'; btn.disabled = false;
            return;
        }

        if (!data.ativo) {
            erroEl.innerText = 'Esta conta está inativa. Entre em contato com o suporte.';
            erroEl.classList.remove('hidden');
            btn.innerText = 'ENTRAR'; btn.disabled = false;
            return;
        }

        // Salva sessão no sessionStorage
        sessionStorage.setItem('empresa_id',   data.id);
        sessionStorage.setItem('empresa_nome', data.nome);
        sessionStorage.setItem('empresa_login', login);

        btn.innerText = 'ENTRANDO...';
        // Redireciona para o sistema
        window.location.href = 'index.html';
    });

    // Se já está logado, vai direto
    if (sessionStorage.getItem('empresa_id')) {
        window.location.href = 'index.html';
    }
    </script>
